name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare build-only Amplify configuration
        run: cp src/aws-exports.example.js src/aws-exports.js

      - name: Test frontend
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Test prediction handler
        run: npm run test:prediction

      - name: Verify model artifacts
        working-directory: services/prediction/models
        run: sha256sum --check checksums.sha256
